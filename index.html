<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto bg-white shadow-2xl rounded-3xl overflow-hidden border border-slate-200">
        <div class="header-main p-8 text-white text-center border-b-8 border-yellow-500">
            <div class="flex justify-center mb-4">

                    <span class="text-blue-900 font-black text-xl">BTS SRI</span>
                </div>
            </div>
            <h1 class="text-xl font-black uppercase tracking-widest">BTS : Systèmes et Réseaux Informatique</h1>
            <p class="text-blue-100 font-bold uppercase text-sm mt-1">Module : Programmation Procédurale (Langage C)</p>
            <p class="text-yellow-400 font-black text-md mt-2 tracking-wide">Formateur: M.R-MOSLEH</p>
            <div class="mt-4 bg-blue-900/50 inline-block px-4 py-1 rounded-full text-xs font-bold border border-blue-400">
                Niveau : 1ère Année | 2025-2026
            </div>
        </div>

        <div class="p-8 grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50 border-b">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Étudiant</label>
                <input type="text" id="studentName" class="w-full p-4 border-2 border-slate-200 rounded-xl outline-none font-semibold focus:border-blue-500 transition-all" placeholder="Nom de l'étudiant">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Sujet du Projet</label>
                <input type="text" id="projectTitle" class="w-full p-4 border-2 border-slate-200 rounded-xl outline-none font-semibold focus:border-blue-500 transition-all" placeholder="Titre du projet">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Date de Soutenance</label>
                <input type="date" id="examDate" class="w-full p-4 border-2 border-slate-200 rounded-xl outline-none font-semibold focus:border-blue-500 transition-all">
            </div>
        </div>

        <div class="p-10 flex flex-col items-center justify-center bg-white">
            <label class="text-xs font-black text-blue-900 uppercase mb-4 tracking-widest">Note Finale / 20</label>
            <input type="number" id="finalNote" value="0" step="0.25" min="0" max="20" oninput="calculateDistribution()" 
                   class="w-56 text-center text-6xl font-black p-4 border-b-8 border-blue-600 text-blue-900 outline-none">
        </div>

        <div class="px-8 pb-8">
            <div class="overflow-hidden rounded-2xl border border-slate-200">
                <table class="w-full text-left">
                    <thead class="bg-blue-900 text-white text-[11px] uppercase tracking-wider">
                        <tr>
                            <th class="p-4">Critères d'évaluation</th>
                            <th class="p-4 text-center w-24">Coefficient</th>
                            <th class="p-4 text-center w-40">Score</th>
                        </tr>
                    </thead>
                    <tbody id="criteriaBody"></tbody>
                </table>
            </div>

            <div class="mt-12 flex justify-center">
                <button onclick="downloadPDF()" class="bg-red-600 hover:bg-red-700 text-white font-black py-4 px-16 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center gap-2">
                    <span>TÉLÉCHARGER LE PDF</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const criteria = [
            { id: "f1", label: "Fonctionnement global", max: 2 },
            { id: "f2", label: "Respect des consignes", max: 2 },
            { id: "f3", label: "Modularité (.c / .h)", max: 2 },
            { id: "f4", label: "Passage de paramètres", max: 1 },
            { id: "f5", label: "Gestion mémoire (Pointeurs)", max: 2 },
            { id: "f6", label: "Gestion des erreurs", max: 2 },
            { id: "f7", label: "Lisibilité & Indentation", max: 1 },
            { id: "f8", label: "Documentation Technique", max: 1 },
            { id: "f9", label: "Démonstration & Réponse", max: 7 }
        ];

        let locked = new Set();

        function render() {
            const body = document.getElementById('criteriaBody');
            body.innerHTML = criteria.map(c => `
                <tr class="border-b hover:bg-slate-50 transition-colors">
                    <td class="p-4 text-sm font-bold text-slate-700">${c.label}</td>
                    <td class="p-4 text-center text-slate-400 font-bold">/${c.max}</td>
                    <td class="p-2 text-center">
                        <input type="number" id="input-${c.id}" step="0.25" oninput="manual('${c.id}')"
                               class="w-24 text-center p-2 font-black rounded-lg border-2 border-slate-200 outline-none focus:border-blue-400">
                    </td>
                </tr>
            `).join('');
        }

        function manual(id) {
            const inp = document.getElementById(`input-${id}`);
            const c = criteria.find(x => x.id === id);
            let val = parseFloat(inp.value);
            if(val > c.max) inp.value = c.max;
            if(val < 0) inp.value = 0;
            locked.add(id);
            inp.classList.add('bg-yellow-50', 'border-yellow-400');
            calculateDistribution();
        }

        function calculateDistribution() {
            let totalInput = document.getElementById('finalNote');
            let total = parseFloat(totalInput.value) || 0;

            // Restriction stricte entre 0 et 20
            if (total > 20) { total = 20; totalInput.value = 20; }
            if (total < 0) { total = 0; totalInput.value = 0; }

            let used = 0;
            locked.forEach(id => used += parseFloat(document.getElementById(`input-${id}`).value) || 0);
            
            let remain = total - used;
            let unlockedMax = 0;
            criteria.forEach(c => { if(!locked.has(c.id)) unlockedMax += c.max; });
            
            criteria.forEach(c => {
                if(!locked.has(c.id)) {
                    let val = unlockedMax > 0 ? (c.max / unlockedMax) * remain : 0;
                    // Utilisation de toFixed(2) mais affichage correct de la valeur
                    document.getElementById(`input-${c.id}`).value = Math.max(0, val).toFixed(2);
                }
            });
        }

      function generatePDFContent(doc) {
    const name = document.getElementById('studentName').value || "..........................";
    const proj = document.getElementById('projectTitle').value || "..........................";
    const dateInput = document.getElementById('examDate').value;
    const formattedDate = dateInput ? new Date(dateInput).toLocaleDateString('fr-FR') : "..........................";

    doc.setFont("helvetica");

    // --- EN-TÊTE OFFICIEL ---
    doc.setFontSize(10).setTextColor(100);
    doc.text("BTS : Systèmes et Réseaux Informatique", 20, 45);
    doc.text("Niveau : 1ère Année", 20, 50);
    
    // Alignement à droite pour le centre et l'année
   // On définit une variable pour la marge droite pour plus de flexibilité
const marginRight = 190;

doc.setFontSize(10).setTextColor(80); // Un gris foncé pour l'élégance

// Ligne 1 : Centre
doc.text("Centre : Lissane Din Iben Alkhatib", marginRight, 45, { align: "right" });

// Ligne 2 : Année scolaire (décalage de 5mm vers le bas)
doc.text("Année scolaire : 2025/2026", marginRight, 50, { align: "right" });

    // Ligne de séparation
    doc.setDrawColor(30, 58, 138); // Bleu foncé
    doc.setLineWidth(0.5);
    doc.line(20, 55, 190, 55);
    
    // --- TITRE DU DOCUMENT ---
    doc.setFontSize(16).setFont("helvetica", "bold").setTextColor(30, 58, 138);
    doc.text("GRILLE D'ÉVALUATION : PROJET C", 105, 68, { align: "center" });
    
    // --- INFOS ÉTUDIANT & SUJET ---
    doc.setTextColor(0); // Noir pour un maximum de clarté

    // Ligne Étudiant : Nom en GRAS
    doc.setFontSize(11);
    doc.setFont("helvetica", "normal");
    doc.text("Étudiant : ", 20, 80);
    
    doc.setFontSize(12);
    doc.setFont("helvetica", "bold");
    doc.text(`${name.toUpperCase()}`, 40, 80); // Nom en gras et majuscules

    // Ligne Sujet : Titre en GRAS et ITALIQUE
    doc.setFontSize(11);
    doc.setFont("helvetica", "normal");
    doc.text("Sujet : ", 20, 88);
    
    doc.setFont("helvetica", "bolditalic"); // Mix gras + italique
    doc.text(`${proj}`, 35, 88); // Décalage à 35 pour le sujet

    // Date à droite (discrète)
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(100);
    doc.text(`Date de soutenance : ${formattedDate}`, 190, 80, { align: "right" });
    
    // Date à droite
    doc.setFontSize(10).text(`Date de soutenance : ${formattedDate}`, 190, 80, { align: "right" });

    // --- TABLEAU DES CRITÈRES ---
    const tableData = criteria.map(c => [
        c.label, 
        `${document.getElementById(`input-${c.id}`).value} / ${c.max}`
    ]);
    
    doc.autoTable({
        startY: 95,
        head: [['Critères d\'évaluation', 'Score / Coefficient']],
        body: tableData,
        theme: 'grid',
        headStyles: { fillColor: [30, 58, 138], halign: 'center', fontSize: 10 },
        columnStyles: { 0: { cellWidth: 120 }, 1: { halign: 'center', fontStyle: 'bold' } },
        styles: { font: "helvetica", fontSize: 10, cellPadding: 4 }
    });

    // --- TOTAL ET SIGNATURE ---
    const finalY = doc.lastAutoTable.finalY + 15;
    
    // Encadré pour la note finale
    doc.setDrawColor(30, 58, 138);
    doc.setLineWidth(1);
    doc.rect(130, finalY, 60, 15); 
    doc.setFontSize(14).setFont("helvetica", "bold");
    doc.text(`NOTE : ${document.getElementById('finalNote').value} / 20`, 160, finalY + 10, { align: "center" });

    // Zone Signature
    doc.setFontSize(10).setFont("helvetica", "italic").setTextColor(100);
    doc.text("Signature du formateur :", 20, finalY + 10);
    doc.text("M. R-MOSLEH", 20, finalY + 20);

    doc.save(`Evaluation_C_${name}.pdf`);
}

        render();
